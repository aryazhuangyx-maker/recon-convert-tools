<script>
// 版本自检：每次加载检查 version.json，记录当前版本
// 同事收到新版本后关闭浏览器重新打开即可看到最新代码，无需自动刷新
(function() {
  var KEY = 'handover_ver';
  fetch('version.json?_=' + Date.now()).then(function(r) { return r.json(); }).then(function(v) {
    var cached = localStorage.getItem(KEY);
    if (cached && cached !== v.version) {
      localStorage.removeItem(KEY);
      localStorage.setItem(KEY, v.version);
    } else {
      localStorage.setItem(KEY, v.version);
    }
  }).catch(function() {});
})();
</script>

<style>
/* ═══════════════════════════════════════════════
   macOS Sonoma 风格 · 苹果风 · 极简白卡
   ═══════════════════════════════════════════════ */
:root {
  --bg-grad: linear-gradient(135deg,
              #C8E1FF 0%,
              #D4DDF7 30%,
              #DDD3EE 65%,
              #E8DAEC 100%);
  --window-bg: rgba(255, 255, 255, 0.86);
  --window-bg-solid: #FFFFFF;
  --sidebar-bg: rgba(246, 247, 250, 0.72);
  --content-bg: #FFFFFF;
  --border: rgba(0, 0, 0, 0.06);
  --border-strong: rgba(0, 0, 0, 0.10);
  --text: #1D1D1F;
  --text-secondary: #6E6E73;
  --text-tertiary: #9A9AA0;
  --accent: #007AFF;
  --accent-light: rgba(0, 122, 255, 0.10);
  --accent-hover: rgba(0, 122, 255, 0.16);
  --dot-red: #FF5F57;
  --dot-yellow: #FEBC2E;
  --dot-green: #28C840;
  --sidebar-w: 240px;
  --sidebar-w-collapsed: 64px;
  --titlebar-h: 44px;
  --window-radius: 16px;
  --shadow-window: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.08), 0 24px 60px rgba(0,0,0,.10);
  --shadow-menu: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
               "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: #ECEDEF;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  letter-spacing: -0.01em;
}

/* ── 全屏容器（占满视口，无外圈背景） ── */
.desktop {
  width: 100vw; height: 100vh;
  display: flex;
}

/* ── macOS 窗口（全屏，去掉圆角/阴影/边框） ── */
.window {
  width: 100vw;
  height: 100vh;
  background: var(--window-bg-solid);
  display: flex; flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ── 顶部 macOS 装饰条 ── */
.titlebar {
  height: var(--titlebar-h);
  flex-shrink: 0;
  display: flex; align-items: center;
  padding: 0 16px;
  background: rgba(255, 255, 255, 0.55);
  border-bottom: 1px solid var(--border);
  position: relative;
  -webkit-app-region: drag;
}
.tb-dots { display: flex; gap: 8px; align-items: center; }
.tb-dot {
  width: 12px; height: 12px; border-radius: 50%;
  border: 0.5px solid rgba(0,0,0,.08);
}
.tb-dot.red    { background: var(--dot-red); }
.tb-dot.yellow { background: var(--dot-yellow); }
.tb-dot.green  { background: var(--dot-green); }

.tb-title {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-size: 13px; font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
  pointer-events: none;
}
.tb-title b { color: var(--text); font-weight: 600; }

.tb-actions {
  margin-left: auto; display: flex; gap: 4px; align-items: center;
  -webkit-app-region: no-drag;
}
.tb-btn {
  width: 32px; height: 28px;
  border: none; background: transparent;
  border-radius: 6px;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.tb-btn:hover { background: rgba(0,0,0,.06); color: var(--accent); }
.tb-btn:active { background: rgba(0,0,0,.10); }

/* ── 窗口主体（侧栏 + 内容） ── */
.body {
  flex: 1;
  display: flex;
  min-height: 0;
}

/* ── 侧边栏 ── */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: width .22s cubic-bezier(.4,.0,.2,1);
}
.sidebar.collapsed { width: var(--sidebar-w-collapsed); }

.sb-head {
  padding: 14px 14px 10px;
  display: flex; align-items: center; gap: 10px;
}
.sb-brand {
  font-size: 15px; font-weight: 600;
  color: var(--text);
  white-space: nowrap; overflow: hidden;
  letter-spacing: -0.01em;
}
.sb-brand .sub {
  font-size: 11px; font-weight: 500;
  color: var(--text-tertiary);
  margin-left: 4px;
  letter-spacing: 0;
}
.sidebar.collapsed .sb-brand { display: none; }
.sidebar.collapsed .sb-head { justify-content: center; padding: 14px 0 10px; }

.sb-search {
  margin: 4px 12px 8px;
  position: relative;
}
.sb-search input {
  width: 100%;
  height: 30px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.7);
  border-radius: 8px;
  padding: 0 10px 0 30px;
  font-size: 12.5px;
  color: var(--text);
  outline: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
  font-family: inherit;
}
.sb-search input::placeholder { color: var(--text-tertiary); }
.sb-search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
  background: #fff;
}
.sb-search svg {
  position: absolute; left: 9px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  pointer-events: none;
}
.sidebar.collapsed .sb-search { display: none; }

.menu {
  flex: 1;
  padding: 4px 8px 12px;
  overflow-y: auto;
  overflow-x: hidden;
}
.menu::-webkit-scrollbar { width: 6px; }
.menu::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 3px; }
.menu::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.25); }

.menu-label {
  font-size: 10.5px; font-weight: 600;
  color: var(--text-tertiary);
  padding: 8px 10px 4px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.sidebar.collapsed .menu-label { display: none; }

.menu-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  margin: 1px 0;
  border-radius: 8px;
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  text-decoration: none;
  white-space: nowrap;
  transition: background .15s, color .15s;
  user-select: none;
  position: relative;
  -webkit-tap-highlight-color: transparent;
}
.menu-item:hover { background: rgba(0,0,0,.05); }
.menu-item.active {
  background: var(--accent);
  color: #fff;
  font-weight: 500;
}
.menu-item.active:hover { background: var(--accent); }
.menu-item.active .menu-icon { color: #fff; }
.menu-item.active::before {
  content: '';
  position: absolute;
  left: -8px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 16px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}
.menu-icon {
  width: 20px; height: 20px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.menu-text { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.sidebar.collapsed .menu-text { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 8px 0; }
.sidebar.collapsed .menu-item.active::before { display: none; }

/* ── 侧栏底部 ── */
.sb-foot {
  padding: 10px 12px 12px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 4px;
}
.foot-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  border: none;
  background: transparent;
  border-radius: 8px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 12.5px;
  white-space: nowrap;
  transition: background .15s, color .15s;
  font-family: inherit;
}
.foot-btn:hover { background: rgba(0,0,0,.05); color: var(--text); }
.foot-btn .menu-icon { color: inherit; }
.sidebar.collapsed .foot-btn .menu-text { display: none; }
.sidebar.collapsed .foot-btn { justify-content: center; padding: 7px 0; }

/* ── 主内容区 ── */
.content {
  flex: 1;
  display: flex; flex-direction: column;
  min-width: 0;
  background: var(--content-bg);
}

/* 工具栏（面包屑 + 操作） */
.toolbar {
  height: 38px;
  flex-shrink: 0;
  display: flex; align-items: center;
  padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,.7);
}
.toolbar-left {
  display: flex; align-items: center; gap: 6px;
  font-size: 12.5px;
  color: var(--text-secondary);
}
.toolbar-left .crumb-cur {
  color: var(--text); font-weight: 500;
}
.toolbar-right {
  margin-left: auto;
  display: flex; gap: 4px;
}
.toolbar-right .tb-btn { width: 28px; height: 26px; }

/* iframe 容器 */
.frames {
  flex: 1;
  position: relative;
  min-height: 0;
  background: #F5F5F7;
}
.tool-frame {
  position: absolute; inset: 0;
  display: none;
}
.tool-frame.active { display: block; }
.tool-frame iframe {
  width: 100%; height: 100%;
  border: none;
  background: #fff;
}
.placeholder {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px;
  color: var(--text-tertiary);
  font-size: 13px;
  background: #F5F5F7;
}

/* ── 隐私条（极简） ── */
.privacy-pill {
  position: absolute;
  bottom: 14px; left: 50%; transform: translateX(-50%);
  background: rgba(255,255,255,.85);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 11.5px;
  padding: 5px 12px;
  border-radius: 999px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
  pointer-events: none;
  z-index: 50;
}

/* ── 移动端 ── */
@media (max-width: 768px) {
  .desktop { padding: 0; }
  .window {
    border-radius: 0;
    height: 100vh;
    max-height: none;
    box-shadow: none;
    border: none;
  }
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
    transform: translateX(-100%);
    transition: transform .25s ease;
    box-shadow: 0 0 40px rgba(0,0,0,.25);
    width: 260px;
  }
  .sidebar.mobile-open { transform: translateX(0); }
  .sidebar.collapsed { width: 260px; transform: translateX(-100%); }
  .sidebar.collapsed.mobile-open { transform: translateX(0); }
  .sidebar.collapsed .menu-text { display: block; }
  .sidebar.collapsed .menu-item { justify-content: flex-start; padding: 8px 10px; }
  .sidebar.collapsed .sb-brand { display: block; }
  .sidebar.collapsed .sb-search { display: block; }
  .sidebar.collapsed .sb-head { justify-content: flex-start; padding: 14px 14px 10px; }
  .sidebar.collapsed .menu-label { display: block; }
  .sidebar.collapsed .foot-btn .menu-text { display: block; }
  .sidebar.collapsed .foot-btn { justify-content: flex-start; padding: 7px 10px; }
  .mask {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(0,0,0,.35);
    display: none;
  }
  .mask.show { display: block; }
}

/* ── 窗口载入动效（全屏去掉了，仅保留极轻微淡入） ── */
@keyframes fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.window { animation: fade-in .2s ease; }
</style>
</head>

<script>
(function () {
  'use strict';

  // 纯前端：四个工具均为本地静态页面，无端口配置
  // liangdan 依赖本地 Python 后端 http://127.0.0.1:8765（app.py，需单独启动）
  var TOOLS = {
    slhy:     { url: 'slhy-v4/index.html',               label: '三流合一核对',   crumb: '三流合一核对' },
    customs:  { url: 'customs/index.html',                label: '报关单转换',     crumb: '报关单转换' },
    vat:      { url: 'vat/增值税申报数据核对工具.html',      label: '增值税申报核对', crumb: '增值税申报核对' },
    liangdan: { url: 'http://127.0.0.1:8765/',            label: '粮单自动化',     crumb: '粮单自动化' }
  };
  var ORDER = ['slhy', 'customs', 'vat', 'liangdan'];
  var STORE_KEY = 'portal_active_tool';

  var current = 'slhy';
  var loaded = { slhy: false, customs: false, vat: false, liangdan: false };
  var isCollapsed = false;

  var sidebar = document.getElementById('sidebar');
  var mask = document.getElementById('mask');

  function loadFrame(key) {
    if (loaded[key]) return;
    loaded[key] = true;
    var frame = document.querySelector('#frame-' + key + ' iframe');
    var ph = document.getElementById('ph-' + key);
    if (ph) ph.style.display = 'none';
    frame.src = buildUrl(key);
  }

  function buildUrl(key) {
    var url = TOOLS[key].url;
    url += (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
    return url;
  }

  function switchTool(key) {
    if (!TOOLS[key]) return;
    current = key;
    // 菜单高亮
    document.querySelectorAll('.menu-item').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-tool') === key);
    });
    // 面板切换（隐藏的 iframe 保留状态，不重复加载）
    ORDER.forEach(function (k) {
      var f = document.getElementById('frame-' + k);
      if (k === key) { f.classList.add('active'); loadFrame(k); }
      else f.classList.remove('active');
    });
    // 顶部标题 + 面包屑
    document.title = TOOLS[key].label + ' · 工作台';
    var tbt = document.getElementById('tb-title');
    if (tbt) tbt.innerHTML = '<b>工作台</b> · ' + TOOLS[key].crumb;
    var cc = document.getElementById('crumb-cur');
    if (cc) cc.textContent = TOOLS[key].crumb;
    // 记忆选择
    try { localStorage.setItem(STORE_KEY, key); } catch (e) {}
  }

  // 菜单点击
  document.querySelectorAll('.menu-item').forEach(function (el) {
    el.addEventListener('click', function () {
      switchTool(el.getAttribute('data-tool'));
      if (mask && mask.classList.contains('show')) mask.classList.remove('show');
    });
  });

  // 收起/展开
  document.getElementById('collapseBtn').addEventListener('click', function () {
    isCollapsed = !isCollapsed;
    sidebar.classList.toggle('collapsed', isCollapsed);
  });

  // 新窗口打开（顶部按钮 + 侧栏底部按钮同源）
  function openCurrent() { window.open(TOOLS[current].url, '_blank'); }
  document.getElementById('openNew').addEventListener('click', openCurrent);
  var on2 = document.getElementById('openNew2');
  if (on2) on2.addEventListener('click', openCurrent);

  // 刷新当前工具（跨域 iframe 不能用 contentWindow.reload，改为重新赋值 src）
  document.getElementById('refreshTool').addEventListener('click', function () {
    var frame = document.querySelector('#frame-' + current + ' iframe');
    var url = buildUrl(current);
    frame.src = 'about:blank';
    setTimeout(function () { frame.src = url; }, 60);
  });

  // 搜索框：按 menu-item 文本过滤
  var search = document.getElementById('sb-search');
  if (search) {
    search.addEventListener('input', function () {
      var q = search.value.trim().toLowerCase();
      document.querySelectorAll('.menu-item').forEach(function (it) {
        var t = it.querySelector('.menu-text');
        var match = !q || (t && t.textContent.toLowerCase().indexOf(q) >= 0);
        it.style.display = match ? '' : 'none';
      });
    });
  }

  // 初始化：恢复上次选择
  var saved = null;
  try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (saved && TOOLS[saved]) current = saved;
  switchTool(current);
})();
</script>
</body>
</html>
